# Quality gates on every push and pull request (see qa/README.md).
# 1. build + static gates   2. marketing browser suites   3. authenticated portal consent journey
name: QA

on:
  push:
    # CMS drafts (cms/** branches) are checked through their pull request instead
    branches-ignore: ['cms/**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Build + static gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build, links, i18n, structured data, social cards
        run: npm run qa
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  portal-consent:
    name: Portal QA · guardian messaging consent
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Authenticated guardian opt-in / opt-out journey
        run: node qa/portal-consent.mjs

  browser:
    name: Browser QA · ${{ matrix.name }}
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: canary, overflow, header
            suites: canary overflow header
          - name: popovers, axe
            suites: popovers axe
          - name: flows, touch, typography
            suites: flows touch typography
          - name: cms
            suites: cms
          - name: theme, pwa, offline
            suites: theme pwa offline
          - name: pixel contrast (both themes)
            contrast: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Run suites (Chrome preinstalled on ubuntu-latest)
        if: ${{ !matrix.contrast }}
        run: node qa/run.mjs ${{ matrix.suites }}
      - name: Pixel contrast audit (axe cannot see text over gradients or glass)
        if: ${{ matrix.contrast }}
        run: |
          node scripts/contrast-audit.mjs "/,/pricing/,/courses/,/about/,/teachers/,/blog/" dark
          node scripts/contrast-audit.mjs "/,/pricing/,/courses/,/teachers/" light
      - name: Summary
        if: always()
        run: test -f qa/report/latest.md && cat qa/report/latest.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report-${{ strategy.job-index }}
          path: qa/report
          retention-days: 14
