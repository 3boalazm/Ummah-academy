<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Used only when the machine has no fontconfig setup (e.g. a bare build image).
     The cards never use system fonts: render.mjs registers its own font files. -->
<fontconfig>
  <cachedir>/tmp/ua-og-fontconfig</cachedir>
</fontconfig>
